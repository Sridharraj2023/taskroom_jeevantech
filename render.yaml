databases:
  - name: taskroom-db
    databaseName: taskroom
    user: taskroom
    plan: 0.1c-256mb
services:
  - type: web
    name: taskroom
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskroom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4100
    preDeployCommand: npm run db:migrate --prefix /app
